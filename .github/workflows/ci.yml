name: 项目检查

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: 类型、代码规范、测试与构建
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 检查类型
        run: npm run typecheck
      - name: 检查代码规范
        run: npm run lint
      - name: 运行测试
        run: npm test
      - name: 构建应用
        run: npm run build
